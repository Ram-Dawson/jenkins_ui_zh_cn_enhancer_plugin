PluginManager.compatWarning=\
 警告：这个插件的新版本被标记为与已安装的插件版本不兼容。 \
 通常这意味着它的行为或 API 发生了变更，或者它使用的设置格式与已安装版本不同。 \
 依赖这个插件的其他插件可能与这次更新不兼容，从而无法正常工作；使用这个插件的任务可能需要重新配置；且/或你可能无法在不手动恢复旧设置的情况下干净地回退到之前的版本。 \
 详情请查阅插件发布说明。
PluginManager.connectionFailed=\
  无法连接到该 URL。
PluginManager.coreWarning=\
 警告：这个插件是为 Jenkins {0} 或更高版本构建的。 \
 Jenkins 如果安装了该插件，将拒绝加载。
PluginManager.depCompatWarning=\
 警告：这个插件需要更新版本的依赖，而其中至少有一个插件与已安装版本不兼容。 \
 通常这意味着它的行为或 API 发生了变更，或使用了与已安装版本不同的设置格式。 \
 依赖该插件的其他插件可能与这次更新不兼容，从而无法正常工作；使用该插件的任务可能需要重新配置；且/或你可能无法在不手动恢复旧设置的情况下干净地回退到之前的版本。 \
 详情请查阅插件发布说明。
PluginManager.depCoreWarning=\
 警告：这个插件依赖的其他插件需要 Jenkins {0} 或更高版本。 \
 Jenkins 将拒绝加载那些要求更新 Jenkins 版本的依赖， \
 进而导致这个插件也无法加载。
