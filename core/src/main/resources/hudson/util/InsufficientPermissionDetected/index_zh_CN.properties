Error=错误
errorMessage.1=\
  检测到 Jenkins 没有足够的权限运行，下方堆栈跟踪已表明这一点。\
  最可能的原因是启用了 Security Manager。\
  如果这是你的预期配置，则需要授予 Jenkins 足够的运行权限。否则，\
  或者如果你并不清楚 Security Manager 是什么，那么最简单的修复方法就是将其关闭。
errorMessage.2=\
  关于如何在你的容器中关闭 Security Manager，请参阅 Jenkins 的 \
  <a href="https://www.jenkins.io/redirect/troubleshooting/disable-security-manager">\
  容器相关文档</a>。
