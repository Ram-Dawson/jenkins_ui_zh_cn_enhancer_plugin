coreWarning=警告：该插件适用于 Jenkins {0} 之后的版本。在您目前的Jenkins中不一定可以正常运行。
depCompatWarning=警告：此插件需要更新相关依赖的插件，且需要更新的依赖插件中至少有一个与当前版本不兼容。这通常是因为插件本身有更新，或者它设定值不适用于当前版本。该插件可能需要重新设置。您可能需要手动还原旧的设置才能还原到旧版。详情请参考此插件的更新。
depCoreWarning=警告：这个插件依赖的相关插件需要 Jenkins {0} 或者更新的版本。Jenkins将会拒绝安装该插件，这会导致该插件安装失败。
