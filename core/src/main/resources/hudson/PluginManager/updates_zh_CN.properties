compatWarning=警告：新版本与现在安装的版本不适配。这通常是因为插件本身的核心功能有更新，或插件的设置值格式不同于目前版本。使用此插件可能需要重新设定。您可能得手动还原旧设置值才能还原到旧版本。详情请参考插件的最新资讯。
