<div>
  此监控项会检查临时目录所在位置的可用磁盘空间；如果低于某个阈值，代理节点将被临时标记为离线。

  <p>
    Java 工具以及测试/构建过程经常会在临时目录中创建文件，如果没有可用空间，它们可能无法正常工作。
  </p>

  <p>
    更具体地说，它检查的是包含
    <code>java.io.tmpdir</code>
    系统属性所指定目录的那个分区上的可用磁盘空间。
    如果你想查看某个代理节点上的这个目录位置，可以访问：
    <code>${rootURL}/computer/AGENTNAME/systemInfo</code>
    。
  </p>
</div>
