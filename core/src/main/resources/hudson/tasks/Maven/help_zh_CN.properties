para1=适用于使用 Maven 作为构建系统的项目。Jenkins 会使用给定的目标和选项调用 Maven。Maven 返回非 0 退出码时，Jenkins 会将构建标记为失败。某些 Maven 版本存在一个 bug，可能不会正确返回退出码。
para2=Jenkins 会将<a href="{0}/env-vars.html">多种环境变量</a>传递给 Maven，你可以在 Maven 中通过 "$&#123;env.VARIABLENAME}" 访问它们。
para3=同样的变量也可以用于命令行参数（就像你从 shell 中调用 Maven 一样）。例如，可以指定 <code>-DresultsFile=\$&#123;WORKSPACE}/\$&#123;BUILD_TAG}.results.txt</code>
