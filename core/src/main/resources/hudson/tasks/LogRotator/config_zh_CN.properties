Days\ to\ keep\ artifacts=发布包保留天数
Days\ to\ keep\ builds=保持构建的天数
Max\ #\ of\ builds\ to\ keep=保持构建的最大个数
Max\ #\ of\ builds\ to\ keep\ with\ artifacts=发布包最大保留#个构建
if\ not\ empty,\ artifacts\ from\ builds\ older\ than\ this\ number\ of\ days\ will\ be\ deleted,\ but\ the\ logs,\ history,\ reports,\ etc\ for\ the\ build\ will\ be\ kept=如果非空，比此早的发布包将被删除，但构建的日志、操作历史、报告等将被保留
if\ not\ empty,\ build\ records\ are\ only\ kept\ up\ to\ this\ number\ of\ days=如果非空，构建记录将保存此天数
if\ not\ empty,\ only\ up\ to\ this\ number\ of\ build\ records\ are\ kept=如果非空，最多此数目的构建记录将被保存
if\ not\ empty,\ only\ up\ to\ this\ number\ of\ builds\ have\ their\ artifacts\ retained=如果非空，最多此数目大构建将保留他们的发布包
