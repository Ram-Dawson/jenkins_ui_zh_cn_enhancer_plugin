<div>
  <p>
    启用后，如果
    <b>最近一次成功构建</b>
    和
    <b>最近一次稳定构建</b>
    符合已配置的构建丢弃规则，Jenkins 也可以将它们删除。
  </p>

  <p>
    默认情况下，即使最近一次成功构建或稳定构建已经早于配置的保留期限，Jenkins 仍会保留它们。
    启用此选项后，将覆盖这一默认行为。
  </p>

  <p>
    <b>示例：</b>
    <br />
    如果配置为 7 天后删除构建，而最近一次成功构建已经是 30 天前的，那么默认情况下它仍会被保留。
    启用此选项后，该构建也会被删除。
  </p>

  <p>在 Pipeline 中也可以这样使用：</p>

  <pre>
options {
    buildDiscarder logRotator(removeLastBuild: true)
}
  </pre>
</div>
