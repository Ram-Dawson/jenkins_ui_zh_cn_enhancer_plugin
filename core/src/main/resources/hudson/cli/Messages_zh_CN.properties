LoginCommand.FullDescription=\
 根据安全域的不同，你可能需要传入类似下面的参数：\n\
 --username USER [ --password PASS | --password-file FILE ]\n\
 某些安全域可能不支持这种方式，例如单点登录（single sign-on）。\n\
 请与 logout 命令配合使用。\n\
 同样的选项也可以用于其他命令，但与其他通用 CLI 选项不同，\n\
 这些选项需要写在命令名之后。\n\
 无论是否保存凭据，如果 Jenkins 不向匿名用户授予 Overall/Read 以及（例如）Job/Read 权限，\n\
 这种认证方式都无法让你把任务等对象作为命令参数引用。\n\
 *已弃用*，请改用 -auth。
