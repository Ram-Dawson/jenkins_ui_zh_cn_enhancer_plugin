BuildCommand.PrintUsageSummary=启动一次构建，并可选择等待其完成。\
  除了常规脚本用途外，此命令还可用于在某个任务的构建过程中触发另一个任务。\
  使用 -s 选项时，命令会根据构建结果改变退出码（退出码 0 表示成功），并且中断该命令会同时中断任务。\
  使用 -f 选项时，命令同样会根据构建结果改变退出码（退出码 0 表示成功），但与 -s 不同，中断命令不会中断任务（退出码 125 表示命令被中断）。\
  使用 -c 选项时，仅当存在 SCM 变更时才会运行构建。
