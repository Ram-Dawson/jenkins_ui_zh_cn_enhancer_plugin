online=该节点当前在线，并会在有空闲执行器时接受任务执行。
temp-offline=该节点已被用户显式设置为临时离线。如果节点仍保持连接，正在运行的任务会继续完成。在用户再次将其设为在线之前，不会启动新的任务。
not-accepting=该节点当前不接受执行任务。这通常意味着节点的可用性设置阻止了任务执行，例如启用了 <code>根据计划让此节点上线</code> 且当前不在允许的时间窗口内。该节点仍可能继续执行在它开始拒绝任务前已启动的任务。只打算运行单个任务的云节点也可能处于这种状态。<br/>在 <code>构建执行器状态</code> 组件中，这类节点会显示为 <code>已挂起</code>。
paused=该节点已因配置的保留策略而离线。需要时（例如有新任务请求它）会重新上线。
offline=以上情况都不适用。该节点当前未连接，或者虽仍保持连接，但节点监控器判断它不处于健康状态。处于此状态的节点应进一步排查。
