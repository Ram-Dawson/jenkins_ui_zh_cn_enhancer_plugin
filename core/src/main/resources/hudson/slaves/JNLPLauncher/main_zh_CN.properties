slaveAgentPort.disabled=从节点端口被禁用
configure.link.text=配置链接
Connect\ agent\ to\ Jenkins\ one\ of\ these\ ways\:=节点连接Jenkins的方式如下：
launch\ agent=启动节点
Launch\ agent\ from\ browser=在浏览器中启动节点
Run\ from\ agent\ command\ line\:=在命令行中启动节点
Or\ if\ the\ agent\ is\ headless\:=或者，当节点是无界面的话
Connected\ via\ JNLP\ agent.=已通过JNLP Agent连接
commonOptions=如果你更希望使用 TCP 而不是 WebSocket，请移除 <code>-webSocket</code> 选项。运行 <code>java -jar agent.jar -help</code> 可查看更多说明。
install-instance-identity=立即安装
instance-identity-missing=<code>instance-identity</code> 插件似乎缺失。这会导致你无法连接 TCP agent。你仍然可以使用 WebSocket agent。
powerShell.cli.curl=注意：PowerShell 用户必须使用 curl.exe 而不是 curl，因为 curl 在 PowerShell 中默认是 Invoke-WebRequest 的别名。
slaveAgent.cli.run=在代理节点命令行中运行：
slaveAgent.cli.run.secret=或者在代理节点命令行中运行，并将密钥保存在文件中：
slaveAgent.connected=代理节点已连接。
tcp-port-disabled=TCP 端口已被禁用，因此无法连接 TCP agent。你仍然可以使用 WebSocket agent。
web-socket-unsupported=当前 Jenkins 安装不支持 WebSocket。你仍然可以使用 TCP agent。
