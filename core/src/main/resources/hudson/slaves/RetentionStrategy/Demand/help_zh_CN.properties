blurb=\
  在这种模式下，Jenkins 会在有需求时让此 Agent 上线，\
  即队列中存在满足以下条件的构建：\
            <ul>\
                <li>它们已在队列中等待至少指定的 <i>需求延迟</i> 时间</li> \
                <li>它们可以在此 Agent 上执行（例如拥有匹配的标签表达式）</li>\
            </ul>\
            在以下情况下，此 Agent 会被置为离线：\
            <ul>\
                <li>此 Agent 上没有正在运行的活动构建</li>\
                <li>此 Agent 已空闲至少指定的 <i>空闲延迟</i> 时间</li>\
            </ul>
