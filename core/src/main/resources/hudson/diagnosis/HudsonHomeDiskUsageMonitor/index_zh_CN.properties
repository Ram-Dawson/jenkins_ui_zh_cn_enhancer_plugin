blurb=<tt>JENKINS_HOME</tt> 就快要空间不足了
description.1=你的 <tt>JENKINS_HOME</tt> ({0}) 就快要满了。\
  一旦这个目录完全被占满，Jenkins 将无法再存储任何数据，从而引发严重问题。
description.2=要解决这个问题，你应该现在就有所行动。
solution.1=清理一下这个磁盘分区以便腾出更多的空间。
solution.2=将 <tt>JENKINS_HOME</tt> 迁移到更大的磁盘分区。\
  具体操作请参考<a href="https://www.jenkins.io/redirect/migrate-jenkins-home">Jenkins 官方文档</a>。
