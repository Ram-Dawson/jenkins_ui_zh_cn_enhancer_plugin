Manage\ Old\ Data=管理旧数据
Name=名称
No\ old\ data\ was\ found.=未找到旧数据。
Type=类型
Version=版本
Unreadable\ Data=不可读数据
Discard\ Unreadable\ Data=丢弃不可读数据
Upgrade=升级
blurb.1=当磁盘上数据的存储方式发生变化时，Jenkins 会采用以下策略：数据会在加载时迁移到新结构，但这些条目/记录不会立即以新格式重新保存。这样在必要时仍可以回退 Jenkins 版本。但与此同时，磁盘上也可能长期保留旧格式数据。下表列出了包含此类数据的条目/记录，以及相关数据结构发生变化的 Jenkins 版本。
blurb.2=有时在读取数据时也会发生错误（例如某个插件写入过数据，后来该插件被禁用；或者结构变化时没有编写迁移代码；又或者 Jenkins 在写入了新版数据后又被降级，而旧版本无法读取这些数据）。这些错误会被记录到日志中，但无法读取的数据会被跳过，因此 Jenkins 仍可以启动并正常工作。
blurb.3=下面的表单可用于将这些条目/记录更新为当前格式。这样做意味着：比所选版本更旧的 Jenkins 或插件版本，将无法再读取以新格式存储的数据。需要注意的是，即使不使用此表单，仅仅在 Jenkins 中创建/配置任务并运行构建，也可能保存出旧版本 Jenkins 或插件无法读取的数据。另外，如果上表右侧报告了任何“不可读取数据”错误，那么在重新保存条目时，这部分数据将会丢失。
blurb.4=最终，用于支持这些数据迁移的代码可能会被移除。兼容性至少会保留 150 个 Jenkins 发布版本。比这个范围更旧的版本会在上方以粗体列出，建议你重新保存这些条目/记录。
blurb.5=（仍有可能回退到最早不低于所选版本的 Jenkins）
blurb.6=这些条目/记录中保留不可读取的数据本身是可以接受的，因为 Jenkins 只会忽略它们。若想避免 Jenkins 启动时出现相关日志消息，可以使用下方按钮重新保存这些条目/记录，从而永久删除这些不可读取的数据。
