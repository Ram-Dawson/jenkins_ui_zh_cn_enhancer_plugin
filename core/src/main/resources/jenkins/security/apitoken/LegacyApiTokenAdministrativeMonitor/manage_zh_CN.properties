title=管理遗留的 API Token 使用
contextMessage=下列用户拥有一个遗留的 API Token. \
  由于遗留 Token 是以可恢复的格式存储的，我们建议迁移到新的 API Token 系统。 \
  另外，在之前版本的 Jenkins 中，会为每个新用户自动创建 API Token. \
  通常情况下，用户不会使用这些 Token，导致更加容易被攻击。 \
  自动生成 Token 的启用必须明确。
recommendationMessage=因此，我们建议你：\
<ul>\
  <li>移除从未使用的 Token</li>\
  <li>当前在使用遗留 Token 的用户，使用新系统生成 Token，并移除他们的遗留 Token</li>\
</ul>
UserId=用户 ID
UserFullName=用户全称
TokenName=Token 名称
NumDaysSinceCreation=距离创建时的天数
NumOfUse=# 使用数
NumDaysSinceLastUse=距离最近一次使用的天数
HasFreshToken=新的 token?
HasFreshToken_tooltip=一个最近使用的新的 Token 是由新系统创建并最近使用了的，而不是用户的遗留 Token. \n\
  注意：遗留 Token 的创建时间在每次 Jenkins 重启后会被重置，也就意味着该时间是不准确的。
HasFreshToken_ok_tooltip=该用户有一个新的 Token
HasFreshToken_warning_tooltip=该用户没有新的 Token
HasMoreRecentlyUsedToken=最近用过的 Token?
HasMoreRecentlyUsedToken_tooltip=一个最近使用的 Token 是由新系统创建并最近使用了的，而不是用户的遗留 Token. \n\
  注意：遗留 Token 的创建时间在每次 Jenkins 重启后会被重置，也就意味着该时间是不准确的。
HasMoreRecentlyUsedToken_ok_tooltip=该用户有一个最近用的 Token
HasMoreRecentlyUsedToken_warning_tooltip=该用户没有最近用过的 Token
NoImpactedUser=没有用户使用遗留 Token
NoCreationDate=该 Token 没有创建时间
NoCreationDateValue=未知
NoLastUse=该 Token 没有最近使用时间
NoLastUseValue=从未使用
RevokeAllSelected=移除所选的 Token
RevokeAllSelected_confirm=你确定要移除所选 %num% 的 Token吗？
RevokeAllSelected_nothing=没有选择 Token，请至少选择一个 Token 来移除
Select=选择
only\ recent=仅最近用过的
only\ fresh=仅新的
all=所有
RevokeAllSelected_title=吊销令牌
