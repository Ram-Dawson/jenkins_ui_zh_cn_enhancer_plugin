CspRecommendation.DisplayName=推荐启用内容安全策略
CspConfiguration.UndefinedToTrueWithResourceDomain=保存此配置后，将启用内容安全策略。
CspConfiguration.UndefinedToTrueWithoutResourceDomain=保存此配置后，将启用内容安全策略。\
  为获得更好的保护，建议配置 <a href="{0}manage/configure#ResourceDomainConfiguration" target="_blank">资源根 URL</a>。\
  <a href="https://www.jenkins.io/redirect/resource-root-url" target="_blank">了解更多。</a>
CspConfiguration.UndefinedToFalse=按当前配置保存后，内容安全策略仍将保持禁用。你现在可以启用它，也可以稍后再启用。
CspConfiguration.FalseToTrueWithoutResourceDomain=保存此配置后，将启用内容安全策略。\
  为获得更好的保护，建议配置 <a href="{0}manage/configure#ResourceDomainConfiguration" target="_blank">资源根 URL</a>。\
  <a href="https://www.jenkins.io/redirect/resource-root-url" target="_blank">了解更多。</a>
CspConfiguration.TrueToTrueWithoutResourceDomain=当前已启用内容安全策略，但为获得更好的保护，仍建议配置 <a href="{0}manage/configure#ResourceDomainConfiguration" target="_blank">资源根 URL</a>。\
  <a href="https://www.jenkins.io/redirect/resource-root-url" target="_blank">了解更多。</a>
