paragraph1=内容安全策略（Content Security Policy，CSP）是一种安全机制，可以减少甚至消除跨站脚本（XSS）等 Web 安全漏洞带来的影响。
paragraph2=大多数常用 Jenkins 插件都兼容 Jenkins 的默认规则集，但当前已安装的所有内容不一定都兼容。\
  如果你启用内容安全策略后导致 Jenkins 界面异常，可以在启动 Jenkins 时将 Java 系统属性 \
  <code>jenkins.security.csp.CspHeader.headerName</code> 设置为 <code>Content-Security-Policy-Report-Only</code>，以再次关闭强制保护。
paragraph3=如果要判断当前环境是否兼容内容安全策略强制执行，请访问 <a href="https://www.jenkins.io/redirect/csp-compatibility" target="_blank">文档网站</a>。
