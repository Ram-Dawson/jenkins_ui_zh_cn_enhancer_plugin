Are\ you\ sure\ you\ want\ to\ restart\ Jenkins?\ Jenkins\ will\ restart\ once\ all\ running\ jobs\ are\ finished.=你确定要重启 Jenkins 吗？当所有运行中的任务结束后 Jenkins 重启。
Yes=是
Jenkins\ cannot\ restart\ itself\ as\ currently\ configured.=Jenkins 在当前配置下无法自我重启。
cannotRestart=Jenkins 在当前配置下无法自行重启。
description=这条消息会显示在 Jenkins 的大多数页面上，你可以用它让用户知道当前发生了什么。如果你不填写，系统会自动添加默认消息。
restartWarning=Jenkins 将尝试暂停任务，并在所有正在运行的任务完成或被暂停后重启。（在某些情况下，Pipeline 构建可能会在短时间内阻止 Jenkins 重启，但它们会在下一次可用时机被暂停，并在 Jenkins 重启后继续运行。）
