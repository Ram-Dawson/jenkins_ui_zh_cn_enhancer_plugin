Title=什么是“项目关系”？
body=如果项目之间彼此依赖，Jenkins 可以通过 <a href="https://www.jenkins.io/redirect/fingerprint">指纹功能</a> 生成的记录，追踪下游项目的某次构建使用了上游项目的哪个构建产物。
For\ this\ feature\ to\ work,\ the\ following\ conditions\ need\ to\ be\ met\:=要让此功能生效，需要满足以下条件：
The\ upstream\ project\ records\ the\ fingerprints\ of\ its\ build\ artifacts.=上游项目需要记录其构建产物的指纹。
The\ downstream\ project\ records\ the\ fingerprints\ of\ the\ upstream\ files\ it\ uses.=下游项目需要记录它所使用的上游文件的指纹。
This\ allows\ Jenkins\ to\ correlate\ two\ projects.=这样 Jenkins 才能将这两个项目关联起来。
