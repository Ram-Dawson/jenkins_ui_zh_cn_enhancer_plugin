grey=该项目已被禁用。
grey_anime=该项目已被禁用，但正在构建。
darkgrey=最近一次构建已中止。
darkgrey_anime=最近一次构建已中止。新的构建正在进行中。
lightgrey=该项目从未构建过。
lightgrey_anime=第一次构建正在进行中。
blue=最近一次构建成功。
blue_anime=最近一次构建成功。新的构建正在进行中。
yellow=最近一次构建成功，但状态不稳定。这通常表示测试失败。
yellow_anime=最近一次构建成功，但状态不稳定。新的构建正在进行中。
red=最近一次构建失败。
red_anime=最近一次构建失败。新的构建正在进行中。
health-81plus=项目健康度高于 80%
health-61to80=项目健康度高于 60%，且不超过 80%
health-41to60=项目健康度高于 40%，且不超过 60%
health-21to40=项目健康度高于 20%，且不超过 40%
health-00to20=项目健康度为 20% 或以下
