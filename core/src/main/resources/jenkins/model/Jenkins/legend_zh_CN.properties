blue=上一个构建成功
blue_anime=上一个构建成功。一个新的构建正在进行中
grey=项目从未构建，或者被禁用
grey_anime=第一次构建中
health-00to20=项目健康度低于20%。你可以将鼠标放在项目图标上以获取更多信息。
health-21to40=项目健康度介于20%~40%。你可以将鼠标放在项目图标上以获取更多信息。
health-41to60=项目健康度介于40%~60%。你可以将鼠标放在项目图标上以获取更多信息。
health-61to80=项目健康度介于60%~80%。你可以将鼠标放在项目图标上以获取更多信息。
health-81plus=项目健康度高于80%。你可以将鼠标放在项目图标上以获取更多信息。
red=上一个构建彻底失败。
red_anime=上一个构建彻底失败。新的构建进行中。
yellow=上一个构建成功，但不够稳定。此图标主要用来表示某些测试失败。
yellow_anime=上一个构建成功，但包含错误。一个新的构建进行中。
