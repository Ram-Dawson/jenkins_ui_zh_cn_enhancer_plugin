CI.blurb=固定设置为字符串“true”，表示这是一个“持续集成”执行环境。
BUILD_NUMBER.blurb=当前构建编号，例如“153”。
BUILD_ID.blurb=当前构建 ID。在 1.597 及之后创建的构建中，它与 BUILD_NUMBER 相同；对于更早的构建，则是 YYYY-MM-DD_hh-mm-ss 格式的时间戳。
BUILD_DISPLAY_NAME.blurb=当前构建的显示名称，默认类似于“#153”。
JOB_NAME.blurb=此次构建所属项目的名称，例如“foo”或“foo/bar”。
JOB_BASE_NAME.blurb=去掉文件夹路径后的项目短名称，例如“bar/foo”对应的“foo”。
BUILD_TAG.blurb=字符串“jenkins-<i>$'{'JOB_NAME}</i>-<i>$'{'BUILD_NUMBER}</i>”。JOB_NAME 中的所有正斜杠（“/”）都会被替换为短横线（“-”）。便于写入资源文件、JAR 文件等进行识别。
EXECUTOR_NUMBER.blurb=标识当前执行此构建的执行器的唯一编号（在同一台机器的执行器之间唯一）。也就是你在“构建执行器状态”中看到的编号，只不过这里从 0 开始，而不是从 1 开始。
NODE_NAME.blurb=如果构建在 Agent 上执行，则为 Agent 名称；如果在内置节点上执行，则为“built-in”（在 Jenkins 2.306 之前为“master”）。
NODE_LABELS.blurb=分配给该节点的、以空白分隔的标签列表。
WORKSPACE.blurb=分配给此构建作为工作空间的目录绝对路径。
WORKSPACE_TMP.blurb=\
  位于工作空间附近的临时目录，既不可浏览，也不会干扰 SCM 检出。\
  该目录最初可能不存在，因此需要时请自行创建（例如在 Linux 上使用 <code>mkdir -p</code>）。\
  当常规工作空间位于驱动器根目录时，不会定义该变量。
JENKINS_HOME.blurb=控制器文件系统上分配给 Jenkins 存储数据目录的绝对路径。
JENKINS_URL.blurb=Jenkins 的完整 URL，例如 <code>http://server:port/jenkins/</code>（注意：只有在系统配置中设置了 <i>Jenkins URL</i> 时才可用）。
BUILD_URL.blurb=此次构建的完整 URL，例如 <code>http://server:port/jenkins/job/foo/15/</code>（必须设置 <i>Jenkins URL</i>）。
JOB_URL.blurb=此任务的完整 URL，例如 <code>http://server:port/jenkins/job/foo/</code>（必须设置 <i>Jenkins URL</i>）。
