Apply\ Migration=应用迁移
blurb=“master” 一词正在退出作为 Jenkins 主进程和内置节点的称呼。主进程现在称为“controller”，内置节点则称为“built-in node”。界面已经更新为使用这些新名称。<ul><li>内置节点的隐式标签会从 <code>master</code> 变更为 <code>built-in</code>。</li><li>内置节点的 <code>NODE_NAME</code> 环境变量也会从 <code>master</code> 变更为 <code>built-in</code>。</li></ul>这些变更可能影响构建行为，因此不会自动应用。在执行迁移前，你应该先完成以下检查：<ul><li>检查任务配置和工具安装器中的标签分配，看看是否使用了 <code>master</code> 标签。迁移后，这些标签分配将不再匹配内置节点。除了更新这些分配外，你也可以显式为内置节点添加 <code>master</code> 标签。</li><li>检查构建脚本中对 <code>NODE_NAME</code> 环境变量的使用。</li></ul><a href="https://www.jenkins.io/redirect/built-in-node-migration" rel="noopener noreferrer" target="_blank">了解更多。</a>
