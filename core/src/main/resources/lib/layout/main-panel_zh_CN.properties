Jenkins\ is\ going\ to\ shut\ down=Jenkins 即将关闭
shutdown=Jenkins 控制器正在准备关机。无法再启动新的构建。
saferestart=Jenkins 控制器正在安全重启。正在运行的构建会先完成，或根据任务类型继续执行。无法再启动新的构建。
