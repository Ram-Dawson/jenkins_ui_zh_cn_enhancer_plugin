Run=运行
Script\ Console=脚本命令行
description=输入任意 <a href="https://www.groovy-lang.org">Groovy 脚本</a>，并在服务器上执行。这对排查问题和诊断非常有用。
instructions=使用 ‘println’ 命令查看输出（如果你使用 System.out，输出会进入服务器的 stdout，更难查看）。所有插件中的类都可以直接使用。<code>jenkins.*</code>、<code>jenkins.model.*</code>、<code>hudson.*</code> 和 <code>hudson.model.*</code> 已预先导入。
impossibleOffline=当代理节点离线时，无法运行脚本。
scriptConsole=脚本控制台
