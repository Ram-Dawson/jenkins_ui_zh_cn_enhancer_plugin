validationBlurb=<p>保存前请使用 LDAP 用户名和密码测试 LDAP 设置。\
  此操作将验证设置，避免您意外被锁定在系统外。</p>\
  <p>同时验证其他几个用户账户也是一个好习惯。若不知道其密码，可以使用空密码，\
  以验证用户查找是否正常工作。</p>\
  <p>如果使用 LDAP 组，请测试属于至少一个 LDAP 组的用户账户，\
  以验证反向组查找。</p>
