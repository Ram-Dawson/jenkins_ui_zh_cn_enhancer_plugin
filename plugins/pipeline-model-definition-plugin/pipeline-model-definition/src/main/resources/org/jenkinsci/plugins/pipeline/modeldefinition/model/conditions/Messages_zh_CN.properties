Aborted.Description=当构建状态为“已中止”时运行
Always.Description=始终运行，与构建状态无关
Changed.Description=如果当前构建状态与上一次构建状态不同则运行
Failure.Description=当构建状态为“失败”时运行
NotBuilt.Description=当构建状态为“未构建”时运行
Success.Description=当构建状态为“成功”或尚未设置时运行
Unstable.Description=当构建状态为“不稳定”时运行
Regression.Description=如果当前构建状态比上一次构建更差则运行
Unsuccessful.Description=如果当前构建状态为“已中止”、“失败”或“不稳定”则运行
Cleanup.Description=无论构建状态如何，始终在所有其他条件之后运行
Fixed.Description=如果上一次构建未成功，且当前构建状态为“成功”则运行
