ParametersAndTriggersInOptions.RejectParameters=不能在 "options" 指令中使用 "parameters" 作业属性。请改用 "parameters { ... }" 指令。
ParametersAndTriggersInOptions.RejectTriggers=不能在 "options" 指令中使用 "triggers" 作业属性。请改用 "triggers { ... }" 指令。
BlockedStepsAndMethodCalls.BlockedSteps.Stage=不能在 Declarative Pipeline 中使用 stage step
BlockedStepsAndMethodCalls.BlockedSteps.Properties=不能在 Declarative Pipeline 中使用 properties step
BlockedStepsAndMethodCalls.BlockedSteps.Parallel=parallel step 只能作为 stage 的 steps 块中唯一的顶层 step 使用
BlockedStepsAndMethodCalls.BlockedSteps.Node=不能在 Declarative Pipeline 中将 node step 作为方法参数调用
