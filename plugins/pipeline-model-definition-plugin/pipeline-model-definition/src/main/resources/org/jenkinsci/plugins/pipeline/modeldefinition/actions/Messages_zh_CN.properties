RestartDeclarativePipelineAction.NullStageName=阶段名称不能为空或者空字符串。
RestartDeclarativePipelineAction.OriginWasNotDeclarative={0} 不是声明式流水线，无法重新运行。
RestartDeclarativePipelineAction.StageNameNotPresent=阶段 {0} 不是 {1} 的顶层阶段，因此无法重新运行。
RestartDeclarativePipelineAction.ProjectNotBuildable=任务 {0} 不可构建。
RestartDeclarativePipelineAction.OriginRunIncomplete=原构建 {0} 未完成，因此无法重新运行。
RestartDeclarativePipelineAction.OriginRunMissingExecution=原构建 {0} 没有执行它的流水线，因此无法重新运行。

Restart.from.Stage=从指定阶段重新运行
