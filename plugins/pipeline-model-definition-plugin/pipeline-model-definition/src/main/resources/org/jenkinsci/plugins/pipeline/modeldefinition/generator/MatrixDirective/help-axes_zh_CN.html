<div>
    <code>matrix</code> 可以包含 <code>axes</code> 和 <code>excludes</code>。
    <ul>
        <li>
        <strong>Axes</strong>：定义矩阵的维度，例如 os/browser 这样的矩阵：linux/macos 对比 chrome/safari。
        </li>
        <li>
        <strong>excludes</strong>：定义需要排除的组合，例如上例中的 linux/safari。
        </li>
    </ul>
</div>
