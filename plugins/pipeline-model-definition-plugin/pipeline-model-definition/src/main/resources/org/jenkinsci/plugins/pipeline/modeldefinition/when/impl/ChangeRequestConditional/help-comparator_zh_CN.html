<p>
    用什么方式将配置的模式与实际值进行比较。
    可能的取值有：
</p>
<ul>
    <li><strong>EQUALS</strong>：普通字符串比较</li>
    <li><strong>GLOB</strong>：<a href="https://ant.apache.org/manual/dirtasks.html#patterns">ANT 风格模式</a></li>
    <li><strong>REGEXP</strong>：<a href="https://docs.oracle.com/javase/7/docs/api/java/util/regex/Pattern.html">正则表达式</a></li>
</ul>
<p>
    如果未指定，默认使用 <strong>EQUALS</strong>。
</p>
