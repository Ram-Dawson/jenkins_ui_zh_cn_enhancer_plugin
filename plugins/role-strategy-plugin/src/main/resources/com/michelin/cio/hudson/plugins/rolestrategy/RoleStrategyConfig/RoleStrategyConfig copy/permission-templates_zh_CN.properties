#blurb=Templates allow to simplify role management when many item roles with identical permissions are required. \
#  Changing the template will automatically change the permissions of all roles that are using the template. 
blurb=模板可以在需要许多具有相同权限的项目角色时简化角色管理。更改模板将自动更改使用该模板的所有角色的权限。
