GIT_COMMIT.blurb=当前检出的提交哈希。
GIT_PREVIOUS_COMMIT.blurb=此分支上一次构建的提交哈希（如有）。
GIT_PREVIOUS_SUCCESSFUL_COMMIT.blurb=此分支上一次成功构建的提交哈希（如有）。
GIT_BRANCH.blurb=远程分支名称（如有）。
GIT_LOCAL_BRANCH.blurb=正在检出的本地分支名称（如适用）。
GIT_CHECKOUT_DIR.blurb=仓库将被检出的目录。若使用了“检出到子目录”，此处会包含其设置值。
GIT_URL.blurb=远程 URL。若有多个远程地址，则分别为 <code>GIT_URL_1</code>、<code>GIT_URL_2</code> 等。
GIT_COMMITTER_NAME.blurb=当前工作区后续提交将使用的已配置 Git 提交者名称（如有）。该值读取自 Jenkins“系统配置”页面的<strong>全局配置 user.name 值</strong>字段。
GIT_AUTHOR_NAME.blurb=当前工作区后续提交将使用的已配置 Git 作者名称（如有）。该值读取自 Jenkins“系统配置”页面的<strong>全局配置 user.name 值</strong>字段。
GIT_COMMITTER_EMAIL.blurb=当前工作区后续提交将使用的已配置 Git 提交者邮箱（如有）。该值读取自 Jenkins“系统配置”页面的<strong>全局配置 user.email 值</strong>字段。
GIT_AUTHOR_EMAIL.blurb=当前工作区后续提交将使用的已配置 Git 作者邮箱（如有）。该值读取自 Jenkins“系统配置”页面的<strong>全局配置 user.email 值</strong>字段。
