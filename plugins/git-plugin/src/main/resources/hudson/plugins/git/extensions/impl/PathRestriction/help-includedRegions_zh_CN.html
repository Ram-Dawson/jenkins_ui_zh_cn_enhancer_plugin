<div>
  每个包含都使用<a href="https://docs.oracle.com/en/java/javase/11/docs/api/java.base/java/util/regex/Pattern.html">java正则表达式模式匹配</a>，
    并且必须用新行分隔。
  空列表意味着所有内容都包含在内。
  <p/>
  <pre>
    myapp/src/main/web/.*\.html
    myapp/src/main/web/.*\.jpeg
    myapp/src/main/web/.*\.gif
  </pre>
  上面的示例说明只有在 html/jpeg/gif 文件时才会发生构建
  一直致力于SCM。如果存在，排除项优先于包含项
  包含区域和排除区域之间的重叠。
</div>
