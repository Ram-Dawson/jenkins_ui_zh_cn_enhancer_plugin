<div>
  指定 Jenkins 将用来决定构建哪个版本的策略。
  <dl>
    <dt>默认</dt>
    <dd>
      对于与“要构建的分支”匹配的每个分支（或所有分支，如果未列出），
      此策略将选择那些最近提交尚未构建的内容。<br>
      如果多个分支符合这些条件，则将选择最旧的分支。
    </dd>
    <dt>逆</dt>
    <dd>
      这与“默认”策略相反 - “分支”下列出的任何分支
      构建”将<strong>不会</strong>被构建。例如，输入模式
      <code>*/master</code> 将导致 Jenkins 构建在任何分支上发现的任何更改，只要
      分支名称 <em> 不</em> 与此模式匹配。<br>
      如果多个分支符合这些条件，则将选择最旧的分支。
    </dd>
  </dl>
  有关上面下拉框中可能列出的任何其他策略的详细信息，请参阅
  各自插件的文档。
</div>
