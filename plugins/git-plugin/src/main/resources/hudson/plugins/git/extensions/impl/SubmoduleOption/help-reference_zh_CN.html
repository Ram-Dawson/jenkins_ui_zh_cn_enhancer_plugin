<div>
  指定包含 Git 在克隆操作期间用作参考的仓库的文件夹。<br/>
  如果该文件夹在执行克隆的控制器或代理上不可用，则将忽略此选项。<br/>
  要准备包含多个子项目的参考文件夹，请创建一个裸 Git 仓库并添加所有远程 url，然后执行提取：<br/>
  <pre>
  git init --bare
  git remote add SubProject1 https://gitrepo.com/subproject1
  git remote add SubProject2 https://gitrepo.com/subproject2
  git fetch --all
  </pre>
</div>
