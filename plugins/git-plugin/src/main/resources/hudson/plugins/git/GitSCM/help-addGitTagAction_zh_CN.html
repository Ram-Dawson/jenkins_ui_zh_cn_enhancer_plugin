<p>
  如果选中，则 git 标签操作将被添加到<strong>在</strong>选中该框之后发生的任何构建。
  在 Git 插件 4.5.0 之前，始终添加 git tag 操作。
  Git 插件 4.5.0 及更高版本不会将 git tag 操作添加到新版本中，除非管理员启用它。
</p>
<p>
  git tag 操作允许用户根据应用标签的构建中使用的 git 提交将标签应用到工作区中的 Git 仓库。
  Git 插件 <strong> 不会 </strong> 将应用的标签推送到任何其他位置。
  如果删除工作区，则应用的标签将会丢失。
  当使用集中仓库时，标记工作区是有意义的，自动将标签应用到集中仓库。
  在代理工作区中应用 git 标签没有太多实际用途。
</p>
