<div>
    <p>要在工作区中检出的分支。
    默认值为“<code>master</code>”。</p>
    <p>请注意，这必须是本地分支名称，例如“master”或“develop”。
    远程分支名称如“origin/master”和“origin/develop”是<strong>不支持</strong>作为分支参数。
    标签名称是<strong>不支持</strong>作为分支参数。
    SHA-1 哈希值是<strong>不支持</strong>作为分支参数。
    通用 <code>checkout</code> 步骤支持远程分支名称、标签名称和 SHA-1 哈希值，其中<a href="https://www.jenkins.io/doc/pipeline/steps/params/scmgit/"><code>scmGit</code> 参数</a>.
    </p>
</div>
