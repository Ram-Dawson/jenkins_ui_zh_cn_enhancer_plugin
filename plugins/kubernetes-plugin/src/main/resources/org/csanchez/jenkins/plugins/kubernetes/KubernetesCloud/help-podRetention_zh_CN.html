<div>
    <p>此设置控制 Jenkins 构建完成后如何保留 agent Pod。可用保留策略如下：</p>
    <ol>
        <li>从不：始终删除 agent Pod。</li>
        <li>失败时：构建期间失败时保留 agent Pod。</li>
        <li>被驱逐时：仅在构建期间被驱逐时保留 agent Pod（例如 Node-pressure）。</li>
        <li>始终：始终保留 agent Pod。</li>
    </ol>
    <p><strong>注意：</strong>Kubernetes 管理员负责管理保留的 agent Pod，Jenkins Kubernetes 插件不会删除它们。</p>
</div>
