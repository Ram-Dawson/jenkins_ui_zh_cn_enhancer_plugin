CredentialsProvider.PermissionGroupTitle=凭据
CredentialsProvider.CreatePermissionDescription=要向凭据提供器中添加凭据，需要具有创建权限。
CredentialsProvider.UpdatePermissionDescription=要修改凭据提供器中的凭据，需要具有更新权限。
CredentialsProvider.ViewPermissionDescription=要查看存储在凭据提供器中的凭据，需要具有查看权限。
CredentialsProvider.DeletePermissionDescription=要移除存储在凭据提供器中的凭据，需要具有删除权限。
CredentialsProvider.ManageDomainsPermissionDescription=要添加、删除或配置凭据提供器中的凭据域（当该提供器支持多个凭据域时），需要具有管理域权限。
CredentialsProvider.UseOwnPermissionDescription=当针对某个任务的即时操作需要由触发该操作的用户选择凭据时，此权限允许用户从自己的私有凭据存储中选择凭据。即时操作包括：带参数构建、为构建打标签、部署制品等。
CredentialsProvider.UseItemPermissionDescription=当针对某个任务的即时操作需要由触发该操作的用户选择凭据时，此权限允许用户从该任务作用域内可用的凭据中选择凭据。即时操作包括：带参数构建、为构建打标签、部署制品等。
