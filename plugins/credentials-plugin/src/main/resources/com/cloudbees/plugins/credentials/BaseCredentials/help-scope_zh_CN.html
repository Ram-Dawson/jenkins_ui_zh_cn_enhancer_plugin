<div>
    确定此凭据可在何处使用。

    <dl>
        <dt>系统</dt>
        <dd>
            此凭据仅对关联它的对象可用。通常可将系统作用域凭据用于邮件认证、节点连接等场景，也就是
            Jenkins 实例自身需要使用该凭据的场景。与全局作用域不同，这会显著限制凭据的使用范围，
            从而为凭据提供更高程度的保密性。
        </dd>
        <dt>全局</dt>
        <dd>
            此凭据对关联它的对象以及该对象的所有子对象可用。通常可将全局作用域凭据用于作业所需的场景。
        </dd>
    </dl>

    <p>
        一般来说，凭据会在一个位置定义，例如“Manage Jenkins”下的凭据配置页，然后在另一个位置使用，
        例如连接新的 SSH 构建节点时。作用域让你可以根据这两个位置之间的关系，声明“这个凭据只能被这些位置使用”。
    </p>
</div>
