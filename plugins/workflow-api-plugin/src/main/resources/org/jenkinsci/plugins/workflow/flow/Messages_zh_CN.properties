FlowDurabilityHint.PERFORMANCE_OPTIMIZED.description=性能优化：速度更快（需要正常关闭 Jenkins 才能保存正在运行的 Pipeline）
FlowDurabilityHint.PERFORMANCE_OPTIMIZED.tooltip=避免在每个步骤写入数据，也避免对数据进行原子写入。如果 Jenkins 正常关闭，Pipeline 可以恢复；但如果 Jenkins 意外失败，正在运行的 Pipeline 会丢失步骤信息，且无法恢复。
FlowDurabilityHint.SURVIVABLE_NONATOMIC.description=持久性较低，速度稍快（仅适用于特殊场景）
FlowDurabilityHint.SURVIVABLE_NONATOMIC.tooltip=在每个步骤写入数据，但避免原子写入。在某些文件系统上，这比最高持久性模式更快；但如果磁盘写入中断或失败，正在运行的 Pipeline 数据可能丢失。
FlowDurabilityHint.MAX_SURVIVABILITY.description=最高可恢复性 / 持久性，但速度最慢
FlowDurabilityHint.MAX_SURVIVABILITY.tooltip=在每个步骤写入数据，并使用原子写入保证完整性。Jenkins 发生故障时，可最大程度保留正在运行的 Pipeline 数据并恢复执行。
