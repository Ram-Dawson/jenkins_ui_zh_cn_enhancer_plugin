instructions=每个令牌均可传入参数：字符串使用 name="value" 形式，布尔值和数字使用 name=value 形式。\
  在字符串参数中，使用 '\\' 转义 '"'、'\\' 和行结束符（'\\n' 或 '\\r\\n'），例如：\
  arg1="\\"quoted\\""; arg2="workspace\\relative\\path"; arg3="one\\ntwo"。没有参数时可省略括号。
defaultSubject=这是 Jenkins 系统配置页面中配置的默认邮件主题。
defaultContent=这是 Jenkins 系统配置页面中配置的默认邮件内容。
defaultPresend=这是 Jenkins 系统配置中配置的默认发送前脚本内容。\
  这是发送前脚本输入字段唯一支持的令牌。
defaultPostsend=这是 Jenkins 系统配置中配置的默认发送后脚本内容。\
  这是发送后脚本输入字段唯一支持的令牌。
projectDefaultSubject=这是当前任务的默认邮件主题。在高级配置中使用此令牌的结果即为上方“默认主题”字段的内容。警告：请勿在“默认主题”或“默认内容”字段中使用此令牌，否则结果未定义。
projectDefaultContent=这是当前任务的默认邮件内容。在高级配置中使用此令牌的结果即为上方“默认内容”字段的内容。警告：请勿在“默认主题”或“默认内容”字段中使用此令牌，否则结果未定义。
