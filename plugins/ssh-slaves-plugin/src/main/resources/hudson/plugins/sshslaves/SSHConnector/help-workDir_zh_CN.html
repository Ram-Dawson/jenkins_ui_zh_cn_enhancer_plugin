<div>
    <i>Remoting 工作目录</i>是内部数据存储，Remoting 可使用它保存缓存、日志和其他元数据。
    详情请参阅 <a href="https://github.com/jenkinsci/remoting/blob/master/docs/workDir.md#remoting-work-directory">Remoting 工作目录</a>。
    如果在 <i>Suffix Start Agent Command</i> 中设置了 remoting 参数 "-workDir PATH" 或 "-jar-cache PATH"，将忽略此字段。
    留空时，会将<i>远程根目录</i>用作<i>Remoting 工作目录</i>。
</div>
