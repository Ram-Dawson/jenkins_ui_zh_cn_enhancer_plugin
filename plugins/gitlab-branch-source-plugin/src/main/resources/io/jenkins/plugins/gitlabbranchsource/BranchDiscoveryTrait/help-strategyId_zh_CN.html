<div>
  决定发现哪些分支。
  <dl>
    <dt>仅包含未同时作为 MR 提交的分支</dt>
    <dd>
      如果正在发现源合并请求，则可能不需要同时将相同变更发现为
      合并请求和分支。
    </dd>
    <dt>仅包含同时作为 MR 提交的分支</dt>
    <dd>
      此选项用于在从插件旧版本升级时保持旧有行为。
      注意：如果您确实需要此选项，请针对这段
      文本提交合并请求。
    </dd>
    <dt>所有分支</dt>
    <dd>
      忽略分支是否也作为合并请求提交，而是发现源
      项目中的所有分支。
    </dd>
  </dl>
</div>
