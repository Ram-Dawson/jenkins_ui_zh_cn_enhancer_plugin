<div>
  决定如何发现合并请求：
  <dl>
    <dt>将合并请求与当前目标分支修订版合并</dt>
    <dd>每个合并请求发现一次，发现的修订版对应于与
      目标分支当前修订版合并后的结果。
    </dd>
    <dt>当前合并请求修订版</dt>
    <dd>每个合并请求发现一次，发现的修订版对应于合并
      请求头部修订版，
      不执行合并。
    </dd>
    <dt>同时包含当前合并请求修订版，以及与当前目标
      分支修订版合并后的合并请求</dt>
    <dd>每个合并请求发现两次。第一次发现的修订版对应于每次扫描中
      与目标分支当前修订版合并后的结果。第二个并行发现的
      修订版对应于未合并的合并请求头部修订版。
    </dd>
  </dl>
</div>
