Recipients=收件人
Send\ e-mail\ for\ every\ unstable\ build=每次不稳定的构建都发送邮件通知
Send\ separate\ e-mails\ to\ individuals\ who\ broke\ the\ build=单独发送邮件给对构建造成不良影响的责任人
description=以空白字符分隔的收件人地址列表。可引用如 <tt>$PARAM</tt> 的构建参数。构建失败、变为不稳定或恢复稳定时将发送电子邮件。
