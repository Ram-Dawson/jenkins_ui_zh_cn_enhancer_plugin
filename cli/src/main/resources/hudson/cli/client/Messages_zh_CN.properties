CLI.Usage=Jenkins CLI\n\
  用法: java -jar jenkins-cli.jar [-s url] 命令 [选项...] 参数...\n\
  选项:\n\
   -s URL       : 服务器url （默认是jenkins_url环境变量）\n\
   -http        : 在http%28s%29上使用原始的cli协议（默认值%3b 与 -ssh 和 -remoting 互斥）\n\
   -ssh         : 使用ssh协议（需要 -user%3b 服务器的ssh端口必须打开，且用户必须已注册公钥。）\n\
   -remoting    : 使用不推荐的远程信道协议 （如果服务器上是打开的；仅用于兼容遗留命令或命令模式）\n\
   -i KEY       : 用于认证的ssh私钥文件（与 -ssh 或 -remoting 一起使用）\n\
   -p HOST:PORT : 用户https代理隧道的http代理主机和端口。参见 https://www.jenkins.io/redirect/cli-https-proxy-tunnel\n\
   -noCertificateCheck : 完全忽略https证书认证。谨慎使用\n\
   -noKeyAuth   : 无需尝试加载ssh认证私钥。与 -i 相反\n\
   -user        : 指定用户（与 -ssh 一起使用）\n\
   -strictHostKey : 要求验证主机key检查（与 -ssh 一起使用）\n\
   -logger FINE : 允许客户端详细日志记录\n\
   -auth [ USER:SECRET | @FILE ] : 指定用户名与密码或用户名与api token（或者从文件加载）；\n\
                                   与 -http 一起使用，或者只在jnlp代理端口禁用时与 -remoting 一起使用\n\
  \n\
  可用的命令取决于服务器。执行 'help' 命令可以查看完整清单。
CLI.NoURL=沒有指定 -s 参数或者 jenkins_url 环境变量。
CLI.VersionMismatch=版本不匹配。cli 无法在此 jenkins 服务器上运行。
CLI.NoSuchFileExists=文件不存在: {0}
CLI.BadAuth=JENKINS_USER_ID 与 JENKINS_API_TOKEN 环境变量必须同时设置，或者同时保持为空。
